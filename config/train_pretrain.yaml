lr: 3.0e-4
weight_decay: 0.01
betas: [0.9, 0.98]
warmup_frac: 0.05
batch_size: 128
max_epochs: 16
patience_epochs: 100        # effectively disabled, as in the lineage run

beta_target: 1.0
kl_anneal_frac: 0.30        # fraction of total steps to ramp beta 0 -> beta_target
free_bits: 2.5               # nats/dim floor

lipschitz_weight: 0.0
lipschitz_sigma_frac: 0.1   # perturbation std as a fraction of empirical latent std
lipschitz_start_frac: 0.30  # activate only after KL annealing completes

length_weight: 0.3           # cross-entropy on the length classifier head (starts near ln(50)=3.9)

log_every: 50
eval_every: 500
checkpoint_dir: checkpoints
run_name: pretrain_fb2p5_v1

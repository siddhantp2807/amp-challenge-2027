[project]
name = "hazralab-amp-challenge-submission"
version = "0.1.0"
description = "Submission entry to the NeurIPS AMP Challenge 2027"
readme = "README.md"
authors = [
    { name = "Siddhant Poudyal", email = "siddhantp457@gmail.com" }
]

requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-Levenshtein>=0.25",
    "tensorboard>=2.16",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "tqdm>=4.66",
    "statsmodels>=0.15.0",
    "biopython>=1.88",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "peptidy>=0.0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "modlamp>=4.3.3",
]

[project.scripts]
generate = "amp_challenge_2027.generate:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# the distribution is named for the lab, but the importable module keeps the
# upstream name that [project.scripts] and scripts/verify_submission.py expect
[tool.uv.build-backend]
module-name = "amp_challenge_2027"
